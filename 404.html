<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — HaanaSewing</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#F7E8E1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16110F" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap">
<style>
  :root {
    --ground:#F7E8E1; --ink:#251C19; --ink-mute:#756259;
    --thread:#8A4034; --line:#E4CEC4;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ground:#16110F; --ink:#EDE4DF; --ink-mute:#968780;
            --thread:#D98C79; --line:#362C28; }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--ground); color:var(--ink); padding:2rem; text-align:center;
    font-family:Optima, Avenir, "Segoe UI", sans-serif;
  }
  .box { max-width:30rem; }
  .mark { font-family:"Playfair Display", Didot, Georgia, serif;
          font-size:1.55rem; letter-spacing:.1em; }
  .mark span { color:var(--thread); }
  .rule { width:54px; height:1px; background:var(--thread); margin:2.4rem auto; }
  h1 { font-family:"Playfair Display", Didot, Georgia, serif; font-weight:400;
       font-size:clamp(2.4rem,7vw,3.6rem); line-height:1.05; letter-spacing:-.03em; }
  h1 em { font-style:italic; color:var(--thread); }
  p { margin-top:1.1rem; color:var(--ink-mute); line-height:1.7; font-size:1rem; }
  a.btn { display:inline-block; margin-top:2.2rem; padding:.9rem 1.7rem;
          border:1px solid var(--thread); border-radius:999px; color:var(--thread);
          text-decoration:none; font-size:11px; letter-spacing:.14em;
          text-transform:uppercase; transition:background .25s, color .25s; }
  a.btn:hover, a.btn:focus-visible { background:var(--thread); color:var(--ground); }
</style>
</head>
<body>
  <div class="box">
    <div class="mark">Haana<span>Sewing</span></div>
    <div class="rule"></div>
    <h1>This seam <em>came loose.</em></h1>
    <p>The page you were looking for isn&rsquo;t here. Everything else is one stitch away.</p>
    <a class="btn" href="/">Back to the atelier</a>
  </div>
</body>
</html>
